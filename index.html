<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ロボット イライラ棒</title>
<script src="qrcode.js"></script>
<style>
  :root { --bg:#0d1017; --panel:#191e2c; --accent:#ffcc33; --danger:#ff3b3b; --ok:#3ee88a; --text:#f2f5ff; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  #hud { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 16px;
    background:var(--panel); flex:0 0 auto; font-weight:800; }
  #hNo { font-size:clamp(20px,3.4vw,34px); min-width:5em; }
  #hTime { font-size:clamp(30px,5.6vw,56px); font-variant-numeric:tabular-nums; letter-spacing:1px; }
  #hRight { display:flex; align-items:center; gap:12px; font-size:clamp(15px,2.4vw,26px); min-width:5em; justify-content:flex-end; }
  #hMsg { color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #gear { background:none; border:none; color:#8a93ad; font-size:26px; padding:4px 6px; cursor:pointer; }
  #area { flex:1 1 auto; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .ov { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; }
  .hidden { display:none !important; }

  #result { pointer-events:none; flex-direction:column; text-align:center; }
  #result.out { background:rgba(255,30,30,.6); }
  #result.win { background:rgba(30,200,110,.55); }
  #rBig { font-size:min(17vw,150px); font-weight:900; line-height:1; color:#fff; text-shadow:0 4px 0 #000, 0 0 30px rgba(0,0,0,.6); }
  #rSub { font-size:min(6vw,48px); font-weight:800; color:#fff; margin-top:14px; text-shadow:0 3px 0 #000; }
  #rRank { font-size:min(4.5vw,36px); font-weight:800; color:#fff; margin-top:10px; text-shadow:0 2px 0 #000; }
  #flash { pointer-events:none; background:rgba(255,30,30,.55); font-size:min(14vw,120px); font-weight:900; color:#fff; text-shadow:0 4px 0 #000; }

  #settings { background:rgba(8,10,16,.92); padding:12px; align-items:stretch; }
  .card { background:var(--panel); border-radius:16px; padding:0 24px 24px; width:100%; max-width:640px; margin:0 auto;
    max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; }
  .card h2 { margin:0 -24px 12px; padding:14px 24px; font-size:22px; position:sticky; top:0; background:var(--panel); z-index:2;
    display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a3147; }
  #sX { background:#353d58; color:#fff; border:none; border-radius:10px; font-size:18px; font-weight:800; padding:10px 18px; font-family:inherit; cursor:pointer; }
  .card h3 { margin:18px 0 6px; font-size:18px; color:var(--accent); }
  .set { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:16px; }
  .set span { width:120px; flex:0 0 auto; }
  .set input[type=range] { flex:1; }
  .set b { width:80px; text-align:right; }
  .set select { flex:1; font-size:16px; padding:6px; border-radius:8px; }
  label.chk { display:block; margin:8px 0; font-size:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .btn { background:var(--accent); color:#222; border:none; border-radius:10px; padding:12px 20px; font-size:17px; font-weight:800; font-family:inherit; cursor:pointer; }
  .btn.sub { background:#353d58; color:var(--text); }
  .btn.warn { background:#7a2a2a; color:#fff; }
  .note { font-size:13px; opacity:.7; line-height:1.5; }
  #shareBox { display:flex; gap:16px; align-items:center; background:#11151f; border-radius:12px; padding:12px; }
  #qr { background:#fff; padding:8px; border-radius:8px; width:156px; height:156px; flex:0 0 auto; }
  #qr svg { width:140px; height:140px; display:block; }
  #rankUrl { font-size:13px; word-break:break-all; -webkit-user-select:text; user-select:text; }
  #shareStat { font-size:14px; margin-top:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="hNo">No.-</div>
    <div id="hTime">0.00</div>
    <div id="hRight"><span id="hMsg"></span><button id="gear" aria-label="設定">⚙︎</button></div>
  </div>
  <div id="area">
    <canvas id="cv"></canvas>
    <div class="ov hidden" id="result"><div id="rBig"></div><div id="rSub"></div><div id="rRank"></div></div>
    <div class="ov hidden" id="flash">ミス！</div>

    <div class="ov hidden" id="settings">
      <div class="card">
        <h2><span>⚙︎ 設定（スタッフ用）</span><button id="sX">✕ 閉じる</button></h2>
        <div class="set"><span>通路の幅</span><input type="range" id="sW" min="16" max="80" step="2"><b id="sWv"></b></div>
        <div class="set"><span>折り返し数</span><input type="range" id="sN" min="2" max="8" step="1"><b id="sNv"></b></div>
        <div class="set"><span>ペン浮き猶予</span><input type="range" id="sG" min="0" max="600" step="50"><b id="sGv"></b></div>
        <div class="set"><span>制限時間</span><select id="sL">
          <option value="0">なし</option><option value="30">30秒</option><option value="60">60秒</option>
          <option value="90">90秒</option><option value="120">120秒</option><option value="180">180秒</option></select></div>
        <div class="set"><span>アウトしたら</span><select id="sM">
          <option value="end">その場で終了（1回勝負）</option>
          <option value="cont">STARTに戻って続行（タイム継続）</option></select></div>
        <div class="set"><span>結果の表示</span><select id="sR">
          <option value="3">3秒</option><option value="5">5秒</option><option value="8">8秒</option></select></div>
        <label class="chk"><input type="checkbox" id="sPen"> Apple Pencilのみ受け付ける（指・手は無視）</label>
        <label class="chk"><input type="checkbox" id="sGuide"> 中央ガイド線を表示</label>
        <label class="chk"><input type="checkbox" id="sSound"> 効果音</label>

        <h3>📺 ランキングを別のタブレットに表示</h3>
        <label class="chk"><input type="checkbox" id="sShare"> 結果をランキング画面に送る</label>
        <div id="shareBox">
          <div id="qr"></div>
          <div>
            <div class="note">別のタブレットでこのQRを読み取るか、下のURLを開いてください。</div>
            <div id="rankUrl"></div>
            <div id="shareStat"></div>
          </div>
        </div>
        <div class="row">
          <button class="btn sub" id="sTest">テスト送信</button>
          <button class="btn sub" id="sRoom">部屋コードを作り直す</button>
        </div>
        <p class="note">※記録の送受信には無料の中継サービス ntfy.sh を使います。送るのは挑戦番号・タイム・到達率だけです。学校のネットワークで ntfy.sh がブロックされていると届きません。</p>

        <h3>記録</h3>
        <div class="row">
          <button class="btn sub" id="sCopy">全記録をCSVでコピー</button>
          <button class="btn warn" id="sReset">記録をリセット</button>
        </div>
        <p class="note">※コースを変えても記録は残ります。公平に比べたいときは、イベント中にコースを変えないでください。</p>
        <div class="row"><button class="btn" id="sClose">閉じる</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 800, H = 500, START_R = 58, GOAL_R = 40;
  const $ = id => document.getElementById(id);
  const RELAY = "https://ntfy.sh/";

  // ---------- 保存 ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("irb_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("irb_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const newRoom = () => "irb-" + Array.from(crypto.getRandomValues(new Uint8Array(9)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
  const cfg = Object.assign({ w:36, n:4, g:150, limit:0, mode:"end", show:5, pen:false, guide:false, sound:true, share:true, room:"" }, store.get("cfg", {}));
  if (!cfg.fingerOk) { cfg.pen = false; cfg.fingerOk = true; store.set("cfg", cfg); }   // 指でも遊べるのを標準に
  if (!cfg.room) { cfg.room = newRoom(); store.set("cfg", cfg); }
  let records = store.get("records", []);
  let nextNo = store.get("nextNo", 1);

  // ---------- コース：大きなSTART円 → ジグザグ → GOAL ----------
  function makeZig(n, w) {
    const top = 60, bot = 440, mid = 250, xa = 200, xb = 640, sp = (xb - xa) / (n - 1);
    w = Math.min(w, sp - 26);
    const path = [[80, mid], [xa, mid], [xa, top]]; let y = top;
    for (let i = 1; i < n; i++) { const x = xa + sp * i; path.push([x, y]); y = y === top ? bot : top; path.push([x, y]); }
    path.push([740, y]);
    let len = 0; for (let i = 0; i < path.length - 1; i++) len += Math.hypot(path[i+1][0]-path[i][0], path[i+1][1]-path[i][1]);
    return { width: w, path, n, len };
  }
  let course = makeZig(cfg.n, cfg.w);
  const S = () => course.path[0], G = () => course.path[course.path.length - 1];

  function distSeg(px, py, ax, ay, bx, by) {
    const dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy;
    let t = l2 ? ((px-ax)*dx + (py-ay)*dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(ax + dx*t - px, ay + dy*t - py);
  }
  function distPath(x, y) {
    let m = Infinity; const p = course.path;
    for (let i = 0; i < p.length - 1; i++) m = Math.min(m, distSeg(x, y, p[i][0], p[i][1], p[i+1][0], p[i+1][1]));
    return m;
  }
  function progressAt(x, y) {
    const p = course.path; let best = Infinity, at = 0, cum = 0;
    for (let i = 0; i < p.length - 1; i++) {
      const [ax, ay] = p[i], [bx, by] = p[i+1], dx = bx-ax, dy = by-ay, L = Math.hypot(dx, dy);
      let t = L ? ((x-ax)*dx + (y-ay)*dy) / (L*L) : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(ax + dx*t - x, ay + dy*t - y);
      if (d < best - 0.5) { best = d; at = cum + L*t; }
      cum += L;
    }
    return at / course.len;
  }
  const inStart = (x, y) => Math.hypot(x - S()[0], y - S()[1]) <= START_R;

  // ---------- 画面サイズ ----------
  const cv = $("cv"), ctx = cv.getContext("2d"), area = $("area");
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = area.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    scale = Math.min(r.width / W, r.height / H);
    offX = (r.width - W * scale) / 2; offY = (r.height - H * scale) / 2;
  }
  window.addEventListener("resize", resize);

  // ---------- 音 ----------
  let actx = null;
  function beep(f, dur, type = "square", vol = .15) {
    if (!cfg.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  const buzz = () => { beep(90, .5, "sawtooth", .25); beep(140, .4, "square", .12); };
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2, "triangle", .2), i * 120));

  // ---------- 状態 ----------
  // idle: START待ち / play: なぞり中 / miss: 続行モードのミス演出 / wait: 続行モードでSTARTに戻るのを待つ / result: 結果表示
  let state = "idle", curNo = 0, tStart = 0, elapsed = 0, maxProg = 0, miss = 0, lockUntil = 0;
  let pen = null, trail = [], activeId = null, liftTimer = null, hitPos = null, hitAt = 0, lastRec = null;
  const hTime = $("hTime"), hMsg = $("hMsg");
  function msg(s, c) { hMsg.textContent = s; hMsg.style.color = c || "var(--accent)"; }

  function cmp(a, b) {
    if (a.ok !== b.ok) return a.ok ? -1 : 1;
    if (a.ok) return a.time - b.time;
    if (b.prog !== a.prog) return b.prog - a.prog;
    return a.time - b.time;
  }
  const rankOf = rec => records.slice().sort(cmp).indexOf(rec) + 1;

  // ---------- ランキング画面へ送信 ----------
  let shareOk = null;
  function publish() {
    if (!cfg.share) return;
    const sorted = records.slice().sort(cmp);
    const body = JSON.stringify({
      v: 1, state, no: state === "idle" ? nextNo : curNo, limit: cfg.limit,
      top: sorted.slice(0, 10).map(r => ({ no: r.no, ok: r.ok, time: r.time, prog: r.prog })),
      total: records.length, clears: records.filter(r => r.ok).length,
      last: lastRec ? { no: lastRec.no, ok: lastRec.ok, time: lastRec.time, prog: lastRec.prog, why: lastRec.why, rank: rankOf(lastRec) } : null
    });
    fetch(RELAY + cfg.room, { method: "POST", body })
      .then(r => { shareOk = r.ok; updShareStat(); })
      .catch(() => { shareOk = false; updShareStat(); });
  }
  function updShareStat() {
    const el = $("shareStat"); if (!el) return;
    el.textContent = !cfg.share ? "送信オフ" : shareOk === null ? "まだ送信していません" : shareOk ? "✅ 送信できています" : "⚠️ 送信できません（ネットワークを確認）";
  }

  // ---------- 進行 ----------
  function showIdle() {
    state = "idle"; pen = null; trail = []; hitPos = null; maxProg = 0;
    clearTimeout(liftTimer); liftTimer = null;
    $("result").classList.add("hidden");
    hTime.textContent = cfg.limit ? cfg.limit.toFixed(2) : "0.00";
    $("hNo").textContent = `No.${nextNo}`;
    msg(lastRec ? `前回 No.${lastRec.no}：${lastRec.ok ? lastRec.time.toFixed(2) + "秒" : "到達" + lastRec.prog + "%"}　${rankOf(lastRec)}位` : "STARTにペンを置いてね", "#aab3cc");
    lockUntil = performance.now() + 1000;   // 直後の誤スタート防止
    publish();
  }
  function begin(x, y, id) {
    curNo = nextNo; nextNo++; store.set("nextNo", nextNo);
    $("hNo").textContent = `No.${curNo}`;
    tStart = performance.now(); elapsed = 0; maxProg = 0; miss = 0;
    grab(x, y, id);
    beep(880, .12, "triangle", .2);
    publish();
  }
  function grab(x, y, id) {
    activeId = id; try { cv.setPointerCapture(id); } catch (_) {}
    state = "play"; pen = [x, y]; trail = [pen]; hitPos = null; msg("");
  }
  function finish(ok, why) {
    clearTimeout(liftTimer); liftTimer = null;
    elapsed = (performance.now() - tStart) / 1000;
    if (cfg.limit && !ok && why === "時間切れ") elapsed = cfg.limit;
    hTime.textContent = elapsed.toFixed(2);
    state = "result";
    if (ok) maxProg = 1;
    const rec = { no: curNo, ok, time: +elapsed.toFixed(2), prog: Math.round(maxProg * 100), miss,
      why: ok ? "" : why, w: Math.round(course.width), n: course.n, at: new Date().toLocaleString("ja-JP") };
    records.push(rec); store.set("records", records); lastRec = rec;
    const rank = rankOf(rec);
    $("result").className = "ov " + (ok ? "win" : "out");
    $("rBig").textContent = ok ? "CLEAR!" : (why === "時間切れ" ? "TIME UP" : "OUT");
    $("rSub").textContent = ok ? `${elapsed.toFixed(2)} 秒${miss ? `（ミス${miss}回）` : ""}` : `${why}　到達 ${rec.prog}%`;
    $("rRank").textContent = `No.${curNo}　${records.length}人中 ${rank}位${rank === 1 && records.length > 1 ? "　🏆トップ！" : ""}`;
    if (ok) { fanfare(); msg("CLEAR!", "var(--ok)"); } else { buzz(); msg(why, "var(--danger)"); }
    publish();
    setTimeout(showIdle, cfg.show * 1000);
  }
  function hit(x, y, why) {
    if (state !== "play") return;
    hitPos = [x, y]; hitAt = performance.now();
    if (cfg.mode === "cont") {
      miss++; state = "miss"; buzz(); clearTimeout(liftTimer); liftTimer = null; activeId = null;
      const f = $("flash"); f.textContent = why; f.classList.remove("hidden");
      setTimeout(() => { f.classList.add("hidden"); if (state === "miss") { state = "wait"; pen = null; trail = []; msg("STARTに戻って再開", "var(--danger)"); } }, 900);
    } else finish(false, why);
  }

  function checkPoint(x, y) {
    if (!inStart(x, y) && distPath(x, y) > course.width / 2) { hit(x, y, "壁に当たった"); return false; }
    const pr = progressAt(x, y); if (pr > maxProg) maxProg = pr;
    if (Math.hypot(x - G()[0], y - G()[1]) < GOAL_R * .7) { finish(true); return false; }
    return true;
  }
  function moveTo(x, y) {
    const [px, py] = pen, d = Math.hypot(x - px, y - py), steps = Math.max(1, Math.ceil(d / 2));
    for (let i = 1; i <= steps; i++) {
      const qx = px + (x - px) * i / steps, qy = py + (y - py) * i / steps;
      if (!checkPoint(qx, qy)) { pen = [qx, qy]; return; }
    }
    pen = [x, y]; trail.push(pen); if (trail.length > 70) trail.shift();
  }

  // ---------- 入力 ----------
  function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale]; }
  const accept = e => !cfg.pen || e.pointerType === "pen";

  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!accept(e) || activeId !== null) return;
    const [x, y] = toL(e);
    if (state === "play" && liftTimer) {           // 猶予内にペンが戻った
      clearTimeout(liftTimer); liftTimer = null; activeId = e.pointerId;
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      moveTo(x, y); return;
    }
    if (!inStart(x, y)) return;
    if (state === "idle" && performance.now() > lockUntil) begin(x, y, e.pointerId);   // ← START円に触れた瞬間に計測開始
    else if (state === "wait") grab(x, y, e.pointerId);                                 // 続行モードの再開
  }, { passive: false });

  cv.addEventListener("pointermove", e => {
    if (e.pointerId !== activeId || state !== "play") return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) { moveTo(...toL(ev)); if (state !== "play") break; }
  }, { passive: false });

  function up(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    if (state !== "play") return;
    if (cfg.g > 0) {
      msg("ペンが浮いた！", "var(--danger)");
      liftTimer = setTimeout(() => { liftTimer = null; hit(pen[0], pen[1], "ペンが離れた"); }, cfg.g);
    } else hit(pen[0], pen[1], "ペンが離れた");
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  document.addEventListener("touchmove", e => { if (!e.target.closest || !e.target.closest(".card")) e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());

  // ---------- 設定 ----------
  const F = id => $(id);
  const sW = F("sW"), sN = F("sN"), sG = F("sG"), sL = F("sL"), sM = F("sM"), sR = F("sR"),
        sPen = F("sPen"), sGuide = F("sGuide"), sSound = F("sSound"), sShare = F("sShare");
  const rankURL = () => new URL("ranking.html?room=" + cfg.room, location.href).href;
  function loadForm() {
    sW.value = cfg.w; sN.value = cfg.n; sG.value = cfg.g; sL.value = cfg.limit; sM.value = cfg.mode; sR.value = cfg.show;
    sPen.checked = cfg.pen; sGuide.checked = cfg.guide; sSound.checked = cfg.sound; sShare.checked = cfg.share;
    labels(); showShare();
  }
  function labels() {
    const eff = makeZig(+sN.value, +sW.value).width;
    $("sWv").textContent = Math.round(eff) + (eff < +sW.value ? "※" : "");
    $("sNv").textContent = sN.value + "回";
    $("sGv").textContent = +sG.value ? sG.value + "ms" : "なし";
  }
  function saveForm() {
    Object.assign(cfg, { w:+sW.value, n:+sN.value, g:+sG.value, limit:+sL.value, mode:sM.value, show:+sR.value,
      pen:sPen.checked, guide:sGuide.checked, sound:sSound.checked, share:sShare.checked });
    store.set("cfg", cfg); course = makeZig(cfg.n, cfg.w); labels(); updShareStat();
  }
  [sW, sN, sG, sL, sM, sR, sPen, sGuide, sSound, sShare].forEach(el => el.addEventListener("input", saveForm));

    function showShare() {
    const url = rankURL();
    $("rankUrl").textContent = url; updShareStat();
    const q = $("qr");
    try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); q.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
    catch (e) { q.textContent = "QRを表示できません。URLを使ってください"; }
  }
  $("gear").onclick = () => { if (state !== "idle") return; loadForm(); $("settings").classList.remove("hidden"); };
  const closeSettings = () => { $("settings").classList.add("hidden"); showIdle(); };
  $("sClose").onclick = closeSettings; $("sX").onclick = closeSettings;
  $("settings").addEventListener("click", e => { if (e.target.id === "settings") closeSettings(); });
  $("sTest").onclick = () => { shareOk = null; $("shareStat").textContent = "送信中…"; const keep = cfg.share; cfg.share = true; publish(); cfg.share = keep; };
  let roomArm = false;
  $("sRoom").onclick = () => {
    const b = $("sRoom");
    if (!roomArm) { roomArm = true; b.textContent = "もう一度押すと変更（QRも変わります）"; setTimeout(() => { roomArm = false; b.textContent = "部屋コードを作り直す"; }, 3000); return; }
    roomArm = false; b.textContent = "部屋コードを作り直す";
    cfg.room = newRoom(); store.set("cfg", cfg); shareOk = null; showShare();
  };
  $("sCopy").onclick = async () => {
    const csv = "挑戦No,結果,タイム秒,到達%,ミス回数,理由,通路幅,折り返し,日時\n" +
      records.map(r => [r.no, r.ok ? "CLEAR" : "OUT", r.time, r.prog, r.miss, r.why, r.w, r.n, r.at].join(",")).join("\n");
    const b = $("sCopy");
    try { await navigator.clipboard.writeText(csv); b.textContent = "コピーしました！"; } catch (e) { b.textContent = "コピーできませんでした"; }
    setTimeout(() => b.textContent = "全記録をCSVでコピー", 1500);
  };
  let armed = false;
  $("sReset").onclick = () => {
    const b = $("sReset");
    if (!armed) { armed = true; b.textContent = "もう一度押すと全消去"; setTimeout(() => { armed = false; b.textContent = "記録をリセット"; }, 3000); return; }
    records = []; nextNo = 1; lastRec = null; store.set("records", records); store.set("nextNo", 1);
    armed = false; b.textContent = "リセットしました"; setTimeout(() => b.textContent = "記録をリセット", 1500);
  };

  // ---------- 描画 ----------
  function stroke(path, w, color) {
    ctx.beginPath(); ctx.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
    ctx.lineWidth = w; ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
  }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0d1017"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

    const flashing = hitPos && now - hitAt < 600 && Math.floor((now - hitAt) / 90) % 2 === 0;
    ctx.fillStyle = flashing ? "#7a1a1a" : "#3a1f2c"; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.strokeStyle = "rgba(255,90,90,.10)"; ctx.lineWidth = 10;
    for (let x = -H; x < W; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke(); }
    ctx.restore();

    const s = S(), g = G();
    // 通路（START円の縁も壁色で囲う）
    circle(s[0], s[1], START_R + 5, "#ff2a2a");
    stroke(course.path, course.width + 10, "#ff2a2a");
    stroke(course.path, course.width, "#f4f4f0");
    if (cfg.guide) { ctx.setLineDash([10, 8]); stroke(course.path, 2, "#7a8aa0"); ctx.setLineDash([]); }
    if (maxProg > 0 && state !== "idle") {
      let need = maxProg * course.len; const done = [course.path[0]];
      for (let i = 0; i < course.path.length - 1 && need > 0; i++) {
        const [ax, ay] = course.path[i], [bx, by] = course.path[i+1], L = Math.hypot(bx-ax, by-ay), t = Math.min(1, need / L);
        done.push([ax + (bx-ax)*t, ay + (by-ay)*t]); need -= L;
      }
      stroke(done, course.width * .5, "rgba(80,200,255,.28)");
    }

    // 大きなSTART円（ここにペンを置くとスタート）
    const ready = (state === "idle" && now > lockUntil) || state === "wait";
    const pulse = .5 + .5 * Math.sin(now / 220);
    if (ready) { ctx.strokeStyle = `rgba(62,232,138,${.8 - .6 * pulse})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(s[0], s[1], START_R + 8 + 10 * pulse, 0, Math.PI * 2); ctx.stroke(); }
    const grd = ctx.createRadialGradient(s[0] - 18, s[1] - 18, 6, s[0], s[1], START_R);
    grd.addColorStop(0, ready ? "#8dffbf" : "#5a8a70"); grd.addColorStop(1, ready ? "#13b862" : "#2c5a42");
    circle(s[0], s[1], START_R, grd);
    ctx.fillStyle = ready ? "#052a14" : "rgba(5,42,20,.7)"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "900 24px sans-serif"; ctx.fillText("START", s[0], s[1] - (state === "idle" ? 8 : 0));
    if (state === "idle") { ctx.font = "bold 12px sans-serif"; ctx.fillText(ready ? "ペンを置いて" : "準備中…", s[0], s[1] + 18); }

    circle(g[0], g[1], GOAL_R, "#ffcc33");
    ctx.fillStyle = "#111"; ctx.font = "900 17px sans-serif"; ctx.fillText("GOAL", g[0], g[1]);

    for (let i = 1; i < trail.length; i++) {
      ctx.strokeStyle = `rgba(0,110,255,${i / trail.length})`; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(trail[i-1][0], trail[i-1][1]); ctx.lineTo(trail[i][0], trail[i][1]); ctx.stroke();
    }
    if (pen && state === "play") {
      ctx.shadowColor = "#3aa0ff"; ctx.shadowBlur = 14; circle(pen[0], pen[1], 5, "#0a66ff"); ctx.shadowBlur = 0;
    }
    if (hitPos && now - hitAt < 800) {
      const k = (now - hitAt) / 800;
      ctx.strokeStyle = `rgba(255,240,80,${1 - k})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(hitPos[0], hitPos[1], 8 + 50 * k, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function loop(now) {
    if (state === "play" || state === "miss" || state === "wait") {
      elapsed = (now - tStart) / 1000;
      hTime.textContent = cfg.limit ? Math.max(0, cfg.limit - elapsed).toFixed(2) : elapsed.toFixed(2);
      if (state === "play" && !liftTimer) msg(`到達 ${Math.round(maxProg * 100)}%`);
      if (cfg.limit && elapsed >= cfg.limit) { state = "play"; finish(false, "時間切れ"); }
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  resize(); showIdle(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
